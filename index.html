<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1559d6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="description" content="لَمحة، لعبة تخمين ذكية تقرّبك من الإجابة سؤالًا بعد سؤال.">
  <link rel="icon" href="brand/lam7a-favicon.svg" type="image/svg+xml">
  <title>لَمحة | لعبة التخمين</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Tahoma, Arial, sans-serif;
      background: #f8f9fc;
      color: #202124;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --muted: #666b73;
      --green: #188038;
      --yellow: #f9ab00;
      --blue: #2468df;
      --red: #d93025;
      --brand-navy: #173a72;
      --panel: rgba(255, 255, 255, .88);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      background:
        radial-gradient(ellipse at 18% 12%, rgba(36, 104, 223, .11), transparent 38%),
        radial-gradient(ellipse at 82% 88%, rgba(67, 151, 238, .08), transparent 38%),
        #f8f9fc;
    }

    button, input { font: inherit; }

    .shell { width: min(100%, 980px); }
    .app-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.8fr) minmax(240px, .85fr);
      gap: 20px;
      align-items: start;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 0 0 24px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .brand-icon {
      position: relative;
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border: 1px solid rgba(36, 104, 223, .13);
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 6px 16px rgba(36, 104, 223, .12);
      animation: brand-arrive .7s cubic-bezier(.2, .8, .2, 1) both;
    }

    .brand-icon img { display: block; width: 34px; height: 34px; }
    @keyframes brand-arrive {
      from { opacity: 0; transform: rotate(-24deg) scale(.65); }
      to { opacity: 1; transform: rotate(0) scale(1); }
    }
    @keyframes content-arrive {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes orb-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    @keyframes robot-think {
      0%, 100% { transform: rotate(0); }
      35% { transform: rotate(-4deg); }
      70% { transform: rotate(3deg); }
    }

    h1 { margin: 0; font-size: clamp(20px, 5vw, 25px); }
    .tagline { margin: 5px 0 0; color: var(--muted); font-size: 13px; }

    .badge {
      border: 1px solid rgba(60, 64, 67, .1);
      border-radius: 999px;
      padding: 8px 12px;
      color: #5f6368;
      background: rgba(255, 255, 255, .78);
      font-size: 12px;
      white-space: nowrap;
    }

    .badge[data-state="offline"] { color: #8a4b00; border-color: rgba(249, 171, 0, .3); }
    .badge[data-state="loading"] { color: var(--muted); }

    .header-actions { display: flex; align-items: center; gap: 10px; }

    .auth-button {
      min-height: 38px;
      padding: 0 14px;
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: var(--blue);
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .auth-button:focus-visible, .provider-button:focus-visible, .dialog-close:focus-visible {
      outline: 3px solid var(--blue);
      outline-offset: 3px;
    }

    .sound-toggle {
      min-height: 38px;
      padding: 0 12px;
      border: 1px solid rgba(60, 64, 67, .1);
      border-radius: 999px;
      color: #3c4043;
      background: rgba(255, 255, 255, .86);
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }

    .auth-dialog {
      width: min(440px, calc(100% - 32px));
      max-height: min(90vh, 760px);
      padding: 26px;
      border: 1px solid rgba(60, 64, 67, .12);
      border-radius: 24px;
      color: #202124;
      background: #fff;
      box-shadow: 0 24px 80px rgba(32, 33, 36, .24);
    }

    .auth-dialog::backdrop { background: rgba(23, 35, 58, .48); backdrop-filter: blur(4px); }
    .auth-dialog h2 { margin: 0 0 8px; font-size: 24px; }
    .auth-dialog p { color: var(--muted); line-height: 1.8; }
    .auth-dialog-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .dialog-close {
      width: 38px;
      height: 38px;
      border: 1px solid rgba(60, 64, 67, .12);
      border-radius: 50%;
      color: #3c4043;
      background: #fff;
      cursor: pointer;
      font-size: 20px;
    }
    .provider-list { display: grid; gap: 10px; margin-top: 20px; }
    .provider-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 50px;
      padding: 0 16px;
      border: 1px solid rgba(60, 64, 67, .16);
      border-radius: 14px;
      color: #202124;
      background: #fff;
      cursor: pointer;
      font-weight: 700;
    }
    .provider-logo { flex: 0 0 20px; width: 20px; height: 20px; }
    .provider-logo.microsoft { display: grid; grid-template-columns: repeat(2, 9px); grid-template-rows: repeat(2, 9px); gap: 2px; }
    .provider-logo.microsoft span:nth-child(1) { background: #f35325; }
    .provider-logo.microsoft span:nth-child(2) { background: #81bc06; }
    .provider-logo.microsoft span:nth-child(3) { background: #05a6f0; }
    .provider-logo.microsoft span:nth-child(4) { background: #ffba08; }
    .provider-button:disabled { color: #777; background: #f1f3f4; cursor: not-allowed; }
    .auth-message { min-height: 48px; margin: 14px 0 0; font-size: 13px; }
    .auth-message[data-state="error"] { color: #b3261e; }
    .auth-message[data-state="success"] { color: #137333; }

    .sound-toggle:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

    main {
      overflow: hidden;
      min-height: 430px;
      border: 1px solid rgba(60, 64, 67, .08);
      border-radius: 30px;
      background: var(--panel);
      box-shadow: 0 10px 36px rgba(60, 64, 67, .09);
      backdrop-filter: blur(14px);
    }

    .sidebar {
      position: sticky;
      top: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 430px;
      max-height: calc(100vh - 40px);
      padding: 18px;
      border: 1px solid rgba(60, 64, 67, .08);
      border-radius: 24px;
      background: rgba(255, 255, 255, .76);
      box-shadow: 0 10px 24px rgba(60, 64, 67, .06);
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .panel-card {
      padding: 16px;
      border: 1px solid rgba(66, 133, 244, .08);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(242,245,255,.9));
    }

    .panel-title {
      margin: 0 0 12px;
      color: #3c4043;
      font-size: 14px;
      font-weight: 700;
    }

    .mini-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 8px;
    }

    .mini-list li {
      padding: 8px 10px;
      border-radius: 10px;
      color: #3c4043;
      background: rgba(232, 240, 254, .55);
      font-size: 13px;
      line-height: 1.7;
    }

    .mini-list span {
      display: block;
      color: var(--muted);
      font-size: 11px;
    }

    .user-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border: 1px solid rgba(66, 133, 244, .14);
      border-radius: 999px;
      background: rgba(232, 240, 254, .72);
      color: #3c4043;
      font-size: 12px;
      font-weight: 700;
    }

    #game { position: relative; padding: clamp(30px, 7vw, 72px); }
    .content { position: relative; max-width: 690px; margin: auto; text-align: center; animation: content-arrive .42s ease-out both; }
    .mode-picker {
      margin: 28px 0;
      padding: 18px;
      border: 1px solid rgba(36, 104, 223, .1);
      border-radius: 24px;
      background:
        radial-gradient(circle at 5% 0%, rgba(116, 185, 255, .16), transparent 34%),
        linear-gradient(145deg, #f8faff, #fff 62%, #f6f9ff);
      text-align: right;
    }
    .mode-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 15px; }
    .mode-title { margin: 0; color: #263b5e; font-size: 16px; font-weight: 800; }
    .mode-subtitle { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .mode-heading-mark { color: #4a83e8; font-size: 23px; }
    .mode-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .mode-option {
      display: flex;
      align-items: center;
      gap: 11px;
      min-height: 76px;
      padding: 12px;
      border: 1px solid rgba(60, 64, 67, .09);
      border-radius: 18px;
      color: #303b4e;
      background: rgba(255, 255, 255, .88);
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(34, 57, 91, .04);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
      text-align: right;
    }
    .mode-option:hover:not(:disabled) { transform: translateY(-2px); border-color: rgba(36, 104, 223, .28); box-shadow: 0 9px 18px rgba(34, 73, 132, .1); }
    .mode-option[aria-pressed="true"] { border-color: #4b83e9; background: linear-gradient(135deg, #eaf2ff, #fff); box-shadow: 0 0 0 2px rgba(36, 104, 223, .1), 0 8px 18px rgba(36, 104, 223, .1); }
    .mode-art { display: grid; flex: 0 0 44px; place-items: center; width: 44px; height: 44px; border-radius: 15px; background: #edf3ff; font-size: 23px; }
    .mode-option[data-mode="animal"] .mode-art { background: #e6f4ea; }
    .mode-option[data-mode="food"] .mode-art { background: #fff1e5; }
    .mode-option[data-mode="object"] .mode-art { background: #f0eafe; }
    .mode-option[data-mode="plant"] .mode-art { background: #e7f5eb; }
    .mode-option[data-mode="person"] .mode-art { background: #fff4d8; }
    .mode-copy { display: grid; flex: 1; gap: 4px; min-width: 0; }
    .mode-copy strong { font-size: 13px; }
    .mode-copy small { color: var(--muted); font-size: 10px; line-height: 1.4; }
    .mode-count { align-self: flex-start; padding: 4px 7px; border-radius: 999px; color: #536780; background: rgba(232, 240, 254, .82); font-size: 10px; white-space: nowrap; }
    .mode-option[aria-pressed="true"] .mode-count { color: #174ea6; background: #d7e5ff; }
    .mode-option:disabled { color: #80868b; background: rgba(245, 246, 248, .9); cursor: not-allowed; }
    .mode-option:focus-visible { outline: 3px solid #8ab4f8; outline-offset: 2px; }
    .mode-option:disabled .mode-art { filter: grayscale(.65); }
    .hint-toggle {
      position: absolute;
      z-index: 1;
      top: 14px;
      right: 14px;
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      padding: 0;
      border: 1px solid rgba(36, 104, 223, .22);
      border-radius: 50%;
      color: #fff;
      background: linear-gradient(145deg, #55a9f5, #1559d6);
      box-shadow: 0 5px 16px rgba(36, 104, 223, .28);
      cursor: pointer;
    }
    .hint-toggle:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(36, 104, 223, .35); }
    .hint-toggle:focus-visible { outline: 3px solid #8ab4f8; outline-offset: 3px; }
    .hint-message {
      margin: 18px 0 0;
      padding: 12px 16px;
      border: 1px solid rgba(36, 104, 223, .15);
      border-radius: 14px;
      color: #174ea6;
      background: #e8f0fe;
      line-height: 1.8;
    }

    .orb {
      display: grid;
      place-items: center;
      width: 90px;
      height: 90px;
      margin: 0 auto 28px;
      border: 1px solid rgba(60, 64, 67, .08);
      border-radius: 26px;
      color: var(--blue);
      background: linear-gradient(145deg, #fff 15%, #e8f0fe 100%);
      box-shadow: 0 8px 24px rgba(66, 133, 244, .12);
      font-size: 38px;
      animation: orb-float 4s ease-in-out infinite;
    }

    .robot-face {
      position: relative;
      display: grid;
      place-items: center;
      width: 74px;
      height: 74px;
      border: 3px solid rgba(66, 133, 244, .4);
      border-radius: 18px;
      background: linear-gradient(180deg, #eef4ff, #ffffff);
      box-shadow: inset 0 0 0 3px rgba(255,255,255,.55), 0 8px 20px rgba(66,133,244,.12);
      overflow: visible;
    }

    .robot-face::before {
      position: absolute;
      top: -10px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 0 2px rgba(255,255,255,.8);
      content: "";
    }

    .robot-face::after {
      position: absolute;
      inset: -6px 10px auto 10px;
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, #1559d6, #55a9f5);
      opacity: .82;
      content: "";
    }

    .robot-eyes {
      display: flex;
      justify-content: center;
      gap: 12px;
      width: 100%;
      margin-top: 8px;
    }

    .robot-eye {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 0 2px rgba(255,255,255,.8);
      transform-origin: center;
      transition: transform .2s ease, background .2s ease;
    }

    .robot-face[data-mood="thinking"] .robot-eye { background: var(--yellow); transform: scaleY(.6); }
    .robot-face[data-mood="happy"] .robot-eye { background: var(--green); }
    .robot-face[data-mood="confused"] .robot-eye { background: var(--red); transform: scaleY(.85); }
    .robot-face[data-mood="sleepy"] .robot-eye { background: var(--muted); transform: scaleY(.4); }
    .robot-face[data-mood="win"] .robot-eye { background: var(--green); transform: scale(1.15); }

    .robot-mouth {
      position: relative;
      width: 28px;
      height: 12px;
      margin-top: 10px;
      border: 3px solid rgba(66, 133, 244, .55);
      border-top: 0;
      border-radius: 0 0 16px 16px;
      transition: all .2s ease;
    }

    .robot-face[data-mood="thinking"] { animation: robot-think 1.8s ease-in-out infinite; }

    .robot-face[data-mood="thinking"] .robot-mouth { width: 18px; border-radius: 999px; border: 3px solid rgba(249,171,0,.8); border-top: 3px solid rgba(249,171,0,.8); }
    .robot-face[data-mood="confused"] .robot-mouth { width: 22px; border-radius: 50%; border-top: 3px solid rgba(217,48,37,.8); border-bottom: 0; }
    .robot-face[data-mood="sleepy"] .robot-mouth { width: 24px; height: 6px; border-radius: 999px; border-top: 0; border-bottom: 3px solid rgba(102,107,115,.9); }
    .robot-face[data-mood="win"] .robot-mouth { width: 34px; height: 16px; border: 3px solid rgba(24,128,56,.8); border-top: 0; border-radius: 0 0 18px 18px; }

    .progress {
      width: min(100%, 420px);
      margin: 18px auto 0;
      padding: 6px;
      border: 1px solid rgba(66, 133, 244, .12);
      border-radius: 999px;
      background: rgba(232, 240, 254, .55);
    }

    .progress-bar {
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, #1559d6, #4285f4, #8ab4f8);
      transition: width .25s ease;
    }

    .confidence-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 185px;
      margin: 14px auto 0;
      padding: 10px 14px;
      border: 1px solid rgba(66, 133, 244, .14);
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(36,104,223,.09), rgba(85,169,245,.14));
      color: #3c4043;
      font-size: 13px;
      font-weight: 700;
    }

    .confidence-box strong {
      color: var(--blue);
      font-size: 15px;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--blue);
      font-size: 13px;
      font-weight: 700;
    }

    h2 { margin: 0 0 16px; font-size: clamp(27px, 6vw, 40px); letter-spacing: -.5px; }
    .welcome-title {
      width: fit-content;
      max-width: 100%;
      margin-inline: auto;
      background: linear-gradient(90deg, #1559d6, #55a9f5);
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .description { margin: 0 auto 28px; color: var(--muted); line-height: 1.9; }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 26px;
    }

    .button {
      min-height: 50px;
      padding: 0 22px;
      border: 1px solid rgba(60, 64, 67, .12);
      border-radius: 999px;
      color: #3c4043;
      background: #fff;
      cursor: pointer;
      font-weight: 700;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }

    .button:hover { transform: translateY(-2px); box-shadow: 0 5px 14px rgba(60, 64, 67, .12); }
    .button:focus-visible, input:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

    .button.secondary {
      color: #3c4043;
      border-color: rgba(60, 64, 67, .14);
      background: #fff;
    }

    .button.no {
      color: var(--red);
      border-color: rgba(217, 48, 37, .25);
      background: #fce8e6;
    }

    .answer-actions { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
    .answer-actions .button { min-height: 58px; padding: 10px 12px; }
    .button.answer-likely-no { color: #1967d2; border-color: rgba(66, 133, 244, .24); background: #e8f0fe; }
    .button.answer-possible { color: #8a5a00; border-color: rgba(249, 171, 0, .32); background: #fef7e0; }
    .button.answer-yes { color: var(--green); border-color: rgba(52, 168, 83, .28); background: #e6f4ea; }
    .button.answer-no { color: #b3261e; border-color: rgba(217, 48, 37, .25); background: #fce8e6; }
    .button.answer-unknown { color: #5f6368; border-color: rgba(60, 64, 67, .16); background: #f1f3f4; }
    .button.primary { color: #fff; border-color: transparent; background: var(--blue); box-shadow: 0 4px 12px rgba(66, 133, 244, .2); }

    .question-card {
      margin: 28px 0 10px;
      padding: 28px 22px;
      border: 1px solid rgba(66, 133, 244, .1);
      border-radius: 22px;
      background: linear-gradient(135deg, #f8faff, #fff);
      font-size: clamp(24px, 6vw, 32px);
      font-weight: 700;
      line-height: 1.6;
    }

    .field { margin: 24px 0 0; text-align: right; }
    .field label { display: block; margin-bottom: 9px; color: #3c4043; font-size: 14px; }

    input {
      width: 100%;
      min-height: 50px;
      padding: 12px 15px;
      border: 1px solid rgba(60, 64, 67, .18);
      border-radius: 14px;
      color: #202124;
      background: #fff;
    }

    input::placeholder { color: #80868b; }
    .hint { margin: 10px 0 0; color: var(--muted); font-size: 13px; line-height: 1.7; }

    .possibilities {
      margin: 20px 0 0;
      padding: 12px 18px;
      border-radius: 14px;
      color: #3c4043;
      background: #f1f3f4;
      line-height: 1.9;
    }

    footer { margin: 16px 0 0; color: #80868b; text-align: center; font-size: 12px; }

    @media (max-width: 700px) {
      .app-layout { grid-template-columns: minmax(0, 1fr); }
      .sidebar { position: static; max-height: none; min-height: 0; overflow: visible; }
    }

    @media (max-width: 440px) {
      header { align-items: flex-start; }
      .header-actions { align-items: flex-end; flex-direction: column-reverse; gap: 7px; }
      .badge { margin-top: 3px; }
      #game { padding: 72px 18px 28px; }
      .hint-toggle { top: 12px; right: 12px; }
      .answer-actions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .answer-actions .button:last-child { grid-column: 1 / -1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">
        <div class="brand-icon" aria-hidden="true"><img src="brand/lam7a-mark.svg" alt=""></div>
        <div>
          <h1>Lam7a</h1>
          <p class="tagline">لَمحة | لعبة تخمين ذكية، وكل إجابة تقرّبنا</p>
        </div>
      </div>
      <div class="header-actions">

        : '<li><span>لا توجد تجارب بعد</span></li>';

      const guessItems = recentGuesses.length
        ? recentGuesses.map(guess => `<li>${escapeHtml(guess)}<span>تخمين سابق</span></li>`).join("")
        : '<li><span>لا توجد تخمينات سابقة</span></li>';

      sidebar.innerHTML = `
        <div class="panel-card">
          <div class="user-pill" id="user-pill">👤 ضيف</div>
        </div>
        <div class="panel-card">
          <p class="panel-title">التجارب</p>
          <ul class="mini-list">${runItems}</ul>
        </div>
        <div class="panel-card">
          <p class="panel-title">التخمينات الفائتة</p>
          <ul class="mini-list">${guessItems}</ul>
        </div>
      `;
    }

    function registerSessionRun(label, status, questions) {
      const historyEntries = loadSessionHistory();
      const entry = { label, status, questions, timestamp: new Date().toISOString() };
      historyEntries.unshift(entry);
      saveSessionHistory(historyEntries.slice(0, 12));
    }

    function rememberGuess(name) {
      const historyEntries = loadSessionHistory();
      if (!historyEntries.length) historyEntries.push({ label: "جلسة جديدة", status: "جديدة", questions: 0, guesses: [] });
      const entry = historyEntries[0];
      if (!entry.guesses) entry.guesses = [];
      entry.guesses.unshift(name);
      entry.guesses = entry.guesses.slice(0, 8);
      saveSessionHistory(historyEntries.slice(0, 12));
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[character]);
    }

    function questionText(question) {
      return question.replace(/^هل\s*/, "").replace(/[؟?]\s*$/, "");
    }

    function button(label, action, style = "") {
      return `<button class="button ${style}" type="button" data-action="${action}">${label}</button>`;
    }

    function getRobotMood(stage = "question") {
      if (stage === "home") return "sleepy";
      if (stage === "loading-question") return "thinking";
      if (stage === "question") {
        const step = askedQuestions.size;
        if (step < 2) return "thinking";
        if (step < 5) return "confused";
        if (step < 8) return "happy";
        return "win";
      }
      if (stage === "guess") return "happy";
      if (stage === "learn-name" || stage === "learn-question" || stage === "learn-answer" || stage === "learn-attributes") return "thinking";
      if (stage === "learned" || stage === "correct") return "win";
      return "happy";
    }

    function renderRobotFace(stage = "question") {
      const mood = getRobotMood(stage);
      return `
        <div class="robot-face" data-mood="${mood}" aria-hidden="true">
          <div class="robot-eyes">
            <span class="robot-eye"></span>
            <span class="robot-eye"></span>
          </div>
          <div class="robot-mouth"></div>
        </div>
      `;
    }

    function computeConfidence() {
      const totalCandidates = Math.max(1, candidates.length || 1);
      const step = askedQuestions.size || 0;
      const derived = 100 - (totalCandidates * 12) - (step * 6);
      return Math.min(96, Math.max(18, derived));
    }

    function computeQuestionProgress() {
      return Math.min(100, Math.round(((askedQuestions.size + 1) / MAX_QUESTIONS_PER_GAME) * 100));
    }

    function getCharacterMode(character) {
      const attributes = character.attributes || {};
      const hasYes = question => attributes[question] === "نعم";
      const hasFamilyYes = family => Object.entries(attributes).some(([question, answer]) =>
        answer === "نعم" && questionFamilyByText.get(question) === family
      );
      if (hasYes("هل هو طعام؟") || hasFamilyYes("food")) return "food";
      if (hasYes("هل هو شخص؟") || hasFamilyYes("person")) return "person";
      if (hasYes("هل هو حيوان؟") || hasFamilyYes("animal")) return "animal";
      if (hasYes("هل هو نبات؟") || hasFamilyYes("plant")) return "plant";
      if (hasYes("هل هو جماد؟") || hasFamilyYes("object")) return "object";
      return "";
    }

    function getCharactersForMode(mode) {
      return mode === "all"
        ? gameData.characters.filter(character => typeof character.name === "string" && character.name.trim())
        : gameData.characters.filter(character =>
          typeof character.name === "string" && character.name.trim() && getCharacterMode(character) === mode
        );
    }

    function getHintText() {
      const outcomes = new Map();
      for (const character of candidates) {
        for (const [question, answer] of Object.entries(character.attributes || {})) {
          const family = questionFamilyByText.get(question);
          if (
            askedAttributes.has(question)
            || questionDomainByText.has(question)
            || (selectedGameMode !== "all" && family && family !== selectedGameMode)
            || (answer !== "نعم" && answer !== "لا")
          ) continue;
          const counts = outcomes.get(question) || { yes: 0, no: 0 };
          counts[answer === "نعم" ? "yes" : "no"] += 1;
          outcomes.set(question, counts);
        }
      }
      const hint = [...outcomes]
        .map(([question, counts]) => {
          const known = counts.yes + counts.no;
          const answer = counts.yes >= counts.no ? "yes" : "no";
          return { question, ...counts, known, answer, consensus: counts[answer] / known };
        })
        .filter(({ known, consensus }) =>
          known >= Math.ceil(candidates.length * 0.6) && consensus >= 0.6
        )
        .sort((first, second) =>
          second.consensus - first.consensus || second.known - first.known
        )[0];
      if (hint) {
        const answerCount = hint[hint.answer];
        const answerText = hint.answer === "yes" ? "موجودة" : "مش موجودة";
        return `تلميح: الصفة «${questionText(hint.question)}» ${answerText} عند ${answerCount} من أصل ${hint.known} احتمال عندي.`;
      }
      return "لسه الاحتمالات متقاربة. إجابتك على السؤال الحالي هتساعدني أضيّقها.";
    }

    function playTone(frequency, duration, type = "sine", volume = 0.025) {
      if (!soundEnabled) return;
      const AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtor) return;
      try {
        const audioContext = new AudioCtor();
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = type;
        oscillator.frequency.value = frequency;
        gain.gain.setValueAtTime(volume, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + duration / 1000);
        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        oscillator.start();
        setTimeout(() => {
          oscillator.stop();
          audioContext.close().catch(error => console.warn("تعذر إغلاق الصوت", error));
        }, duration);
      } catch (error) {
        console.warn("تعذر تشغيل الصوت", error);
      }
    }

    function updateSoundToggle() {
      const toggle = document.querySelector("#sound-toggle");
      toggle.setAttribute("aria-pressed", String(soundEnabled));
      toggle.setAttribute("aria-label", soundEnabled ? "إيقاف المؤثرات الصوتية" : "تشغيل المؤثرات الصوتية");
      toggle.textContent = soundEnabled ? "🔊 الصوت يعمل" : "🔇 الصوت متوقف";
    }

    function updateMusicToggle() {
      const toggle = document.querySelector("#music-toggle");
      toggle.setAttribute("aria-pressed", String(musicEnabled));
      toggle.setAttribute("aria-label", musicEnabled ? "إيقاف موسيقى اللعبة" : "تشغيل موسيقى اللعبة");
      toggle.textContent = musicEnabled ? "♫ موسيقى اللعبة مفعّلة" : "♫ موسيقى اللعبة متوقفة";
    }

    function playMusicNote(context, frequency, duration, volume, wave = "sine") {
      const oscillator = context.createOscillator();
      const filter = context.createBiquadFilter();
      const gain = context.createGain();
      const start = context.currentTime;
      oscillator.type = wave;
      oscillator.frequency.value = frequency;
      filter.type = "lowpass";
      filter.frequency.value = wave === "triangle" ? 1100 : 2400;
      filter.Q.value = 0.35;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(volume, start + (wave === "triangle" ? 0.55 : 0.16));
      gain.gain.setTargetAtTime(0.0001, start + duration - 0.3, wave === "triangle" ? 0.2 : 0.1);
      oscillator.connect(filter);
      filter.connect(gain);
      gain.connect(musicGain);
      oscillator.onended = () => {
        oscillator.disconnect();
        filter.disconnect();
        gain.disconnect();
      };
      oscillator.start(start);
      oscillator.stop(start + duration);
    }

    function startMusic() {
      if (!musicEnabled || musicContext) return;
      const AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtor) {
        console.warn("متصفحك لا يدعم تشغيل موسيقى اللعبة.");
        return;
      }

      const context = new AudioCtor();
      musicContext = context;
      musicGain = context.createGain();
      musicGain.gain.value = 0.13;
      musicGain.connect(context.destination);

      const melody = [
        523.25, 587.33, 659.25, 783.99, 659.25, 587.33, 523.25, 0,
        587.33, 659.25, 783.99, 880, 783.99, 659.25, 587.33, 0
      ];
      const chords = [
        { root: 130.81, notes: [261.63, 329.63, 392, 493.88] },
        { root: 196, notes: [293.66, 392, 493.88, 587.33] },
        { root: 110, notes: [261.63, 329.63, 440, 523.25] },
        { root: 174.61, notes: [261.63, 349.23, 440, 523.25] }
      ];
      let step = 0;
      const playNextStep = () => {
        if (musicContext !== context || !musicEnabled) return;
        if (step % 4 === 0) {
          const chord = chords[Math.floor(step / 4) % chords.length];
          playMusicNote(context, chord.root, 2.05, 0.02, "sine");
          for (const note of chord.notes) {
            playMusicNote(context, note, 2.05, 0.007, "triangle");
          }
        }
        const note = melody[step % melody.length];
        if (note) playMusicNote(context, note, 0.48, 0.025, "sine");
        step += 1;
        musicTimer = setTimeout(playNextStep, 520);
      };

      context.resume().then(() => {
        if (musicContext === context && musicEnabled) playNextStep();
      }).catch(error => console.warn("تعذر تشغيل موسيقى اللعبة:", error));
    }

    function stopMusic() {
      if (musicTimer !== null) {
        clearTimeout(musicTimer);
        musicTimer = null;
      }
      if (!musicContext) return;
      const context = musicContext;
      musicContext = null;
      musicGain = null;
      context.close().catch(error => console.warn("تعذر إيقاف موسيقى اللعبة:", error));
    }

    function setAiStatus(message, state) {
      const badge = document.querySelector("#ai-status");
      badge.textContent = message;
      badge.dataset.state = state;
    }

    async function refreshAiStatus() {
      try {
        const response = await fetch("/api/status");
        const status = await response.json();
        if (hasQuestionRequestResult) return;
        if (status.ready) {
          setAiStatus(
            status.provider === "Local" ? "وضع محلي · بدون AI" : "AI جاهز · " + status.model,
            "ready"
          );
        } else {
          setAiStatus("AI غير جاهز", "offline");
        }
      } catch (error) {
        if (!hasQuestionRequestResult) setAiStatus("وضع محلي · بدون اتصال", "ready");
      }
    }

    function startGame() {
      candidates = getCharactersForMode(selectedGameMode);
      askedQuestions = new Set();
      askedAttributes = new Set();
      history = [];
      wrongGuess = null;
      hintVisible = false;
      activeSessionLabel = "جلسة جديدة";
      playTone(660, 120, "triangle", 0.02);
      startMusic();
      advanceGame();
    }

    function advanceGame() {
      if (candidates.length === 0) {
        beginLearning(null);
        return;
      }
      if (candidates.length === 1) {
        stage = "guess";
        render();
        return;
      }
      if (askedQuestions.size >= MAX_QUESTIONS_PER_GAME) {
        stage = "guess";
        render();
        return;
      }
      requestNextQuestion();
    }

    function getDistinguishingAttributes() {
      const outcomes = new Map();
      const { domain, excludedDomains } = getQuestionDomainContext();
      for (const character of candidates) {
        for (const [question, answer] of Object.entries(character.attributes || {})) {
          if (
            askedAttributes.has(question)
            || (answer !== "نعم" && answer !== "لا")
            || !isQuestionAllowedForDomain(question, domain, excludedDomains)
          ) continue;
          const knownAnswers = outcomes.get(question) || { yes: 0, no: 0 };
          knownAnswers[answer === "نعم" ? "yes" : "no"] += 1;
          outcomes.set(question, knownAnswers);
        }
      }
      return [...outcomes]
        .filter(([, answers]) => answers.yes > 0 && answers.no > 0)
        .slice(0, 80)
        .map(([question]) => question);
    }

    function getQuestionDomainContext() {
      let domain = "";
      const excludedDomains = new Set();
      for (const entry of history) {
        const attribute = entry.attribute_key || entry.question;
        const category = questionDomainByText.get(attribute);
        if (!category) continue;
        if (entry.answer === "نعم") {
          domain = category;
          excludedDomains.delete(category);
        } else if (entry.answer === "لا") {
          excludedDomains.add(category);
          if (domain === category) domain = "";
        }
      }
      return { domain, excludedDomains };
    }

    function isQuestionAllowedForDomain(question, domain, excludedDomains) {
      const questionDomain = questionDomainByText.get(question);
      if (questionDomain) {
        if (excludedDomains.has(questionDomain)) return false;
        if (!domain) return true;
        if (domain === "living") return ["living", "person", "animal", "plant"].includes(questionDomain);
        if (domain === "object") return questionDomain === "object" || questionDomain === "food";
        return questionDomain === domain;
      }
      const family = questionFamilyByText.get(question);
      if (!family) return true;
      if (excludedDomains.has(family)) return false;
      if (!domain) return false;
      if (domain === "living") return ["person", "animal", "plant"].includes(family);
      return family === domain;
    }

    function getBestLocalQuestion(candidateAttributes) {
      let bestAttribute = "";
      let bestScore = 0;
      const { domain } = getQuestionDomainContext();
      const categoryQuestions = candidateAttributes.filter(question => questionDomainByText.has(question));
      const prioritizedQuestions = !domain || domain === "living" || domain === "object"
        ? categoryQuestions
        : [];
      const questionsToScore = prioritizedQuestions.length ? prioritizedQuestions : candidateAttributes;
      for (const attribute of questionsToScore) {
        const yesCount = candidates.filter(character => character.attributes?.[attribute] === "نعم").length;
        const noCount = candidates.filter(character => character.attributes?.[attribute] === "لا").length;
        const score = Math.min(yesCount, noCount);
        if (score > bestScore) {
          bestAttribute = attribute;
          bestScore = score;
        }
      }
      return bestAttribute;
    }

    async function requestNextQuestion() {
      const requestId = ++questionRequestId;
      const candidateAttributes = getDistinguishingAttributes();
      currentQuestionAttribute = "";
      stage = "loading-question";
      render();

      try {
        const response = await fetch("/api/next-question", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            history,
            candidates: candidates.slice(0, 40).map(character => ({
              name: character.name,
              attributes: Object.fromEntries(
                Object.entries(character.attributes || {})
                  .filter(([question, answer]) => !askedQuestions.has(question) && (answer === "نعم" || answer === "لا"))
                  .slice(0, 8)
              )
            })),
            candidate_count: candidates.length,
            candidate_attributes: candidateAttributes,
            asked_questions: [...askedQuestions],
          })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "تعذر الحصول على سؤال من الذكاء الاصطناعي.");
        const question = result.question;
        if (
          typeof question !== "string"
          || askedQuestions.has(question)
          || typeof result.attribute_key !== "string"
          || !candidateAttributes.includes(result.attribute_key)
        ) {
          throw new Error("الذكاء الاصطناعي أعاد سؤالاً غير صالح أو غير مرتبط بسمة معروفة.");
        }
        currentQuestion = question;
        currentQuestionAttribute = result.attribute_key;
        hasQuestionRequestResult = true;
        setAiStatus("السؤال جاهز", "ready");
      } catch (error) {
        console.warn("تعذر إنشاء السؤال بالذكاء الاصطناعي:", error);
        if (requestId !== questionRequestId) return;
        hasQuestionRequestResult = true;
        const fallbackQuestion = getBestLocalQuestion(candidateAttributes);
        if (fallbackQuestion) {
          currentQuestion = fallbackQuestion;
          currentQuestionAttribute = fallbackQuestion;
          setAiStatus("وضع محلي · بدون AI", "ready");
          stage = "question";
          render();
          return;
        }
        setAiStatus("وضع محلي · تخمين", "ready");
        if (candidates.length) {
          stage = "guess";
        } else {
          beginLearning(null);
          return;
        }
        render();
        return;
      }

      if (requestId !== questionRequestId) return;
      stage = "question";
      render();
    }

    function answerQuestion(answer) {
      hintVisible = false;
      askedQuestions.add(currentQuestion);
      if (currentQuestionAttribute) askedAttributes.add(currentQuestionAttribute);
      history.push({ question: currentQuestion, answer, attribute_key: currentQuestionAttribute });
      const frequency = answer === "نعم" ? 620 : answer === "لا" ? 340 : answer === "الظاهر لا" ? 250 : 200;
      playTone(frequency, 90, answer === "نعم" ? "triangle" : "sine", 0.03);
      const attributeKey = currentQuestionAttribute || currentQuestion;
      if (answer === "نعم" || answer === "لا") {
        candidates = candidates.filter(character => {
          const characterAnswer = character.attributes?.[attributeKey];
          return characterAnswer === answer || (characterAnswer !== "نعم" && characterAnswer !== "لا");
        });
      } else if (answer === "الظاهر لا") {
        candidates.sort((first, second) =>
          Number(second.attributes?.[attributeKey] === "لا") -
          Number(first.attributes?.[attributeKey] === "لا")
        );
      }
      if (candidates.length === 0) {
        beginLearning(null);
      } else {
        advanceGame();
      }
    }

    function beginLearning(guessedCharacter) {
      wrongGuess = guessedCharacter;
      stage = "learn-name";
      render();
    }

    function submitName(name) {
      const cleanName = name.trim();
      if (!cleanName) return;
      targetCharacter = gameData.characters.find(character => character.name === cleanName);
      if (!targetCharacter) {
        targetCharacter = { name: cleanName, attributes: {} };
        gameData.characters.push(targetCharacter);
      }
      stage = "learn-question";
      render();
    }

    function submitDistinguishingQuestion(question) {
      newQuestion = question.trim();
      if (!newQuestion) return;
      if (!gameData.all_questions.includes(newQuestion)) {
        gameData.all_questions.push(newQuestion);
      }
      stage = "learn-answer";
      render();
    }

    function finishLearning(answer) {
      targetCharacter.attributes[newQuestion] = answer;
      if (wrongGuess) {
        const guessed = gameData.characters.find(character => character.name === wrongGuess);
        if (guessed) guessed.attributes[newQuestion] = answer === "نعم" ? "لا" : "نعم";
      }
      const learningScores = gameData.all_questions.map(question => {
        const knownYes = gameData.characters.filter(character =>
          character !== targetCharacter && character.attributes[question] === "نعم"
        ).length;
        const knownNo = gameData.characters.filter(character =>
          character !== targetCharacter && character.attributes[question] === "لا"
        ).length;
        return { question, score: knownYes && knownNo ? Math.min(knownYes, knownNo) : 0 };
      });
      remainingQuestions = learningScores
        .filter(({ question, score }) =>
          score > 0 && targetCharacter.attributes[question] !== "نعم" && targetCharacter.attributes[question] !== "لا"
        )
        .sort((a, b) => b.score - a.score)
        .slice(0, 5)
        .map(({ question }) => question);
      if (remainingQuestions.length) {
        stage = "learn-attributes";
      } else {
        completeLearning();
        return;
      }
      render();
    }

    function answerRemainingQuestion(answer) {
      const question = remainingQuestions.shift();
      targetCharacter.attributes[question] = answer;
      if (remainingQuestions.length) {
        render();
      } else {
        completeLearning();
      }
    }

    function completeLearning() {
      saveGameData();
      registerSessionRun(targetCharacter.name, "تمت إضافة شخصية جديدة", askedQuestions.size + remainingQuestions.length + 1);
      rememberGuess(targetCharacter.name);
      stopMusic();
      stage = "learned";
      render();
    }

    function render() {
      renderSidebar();
      if (stage === "home") {
        const modes = GAME_MODES.map(mode => {
          const count = mode.id === "all" ? getCharactersForMode("all").length : getCharactersForMode(mode.id).length;
          const unavailable = count === 0;
          const descriptions = {
            all: "خلّي لَمحة تختار من كل الاحتمالات",
            animal: "من الكائنات الأليفة والبرية",
            food: "أكلات ومشروبات متنوعة",
            object: "أدوات وأشياء من حولك",
            plant: "أشجار ونباتات من الطبيعة",
            person: "شخصيات حقيقية وخيالية"
          };
          const description = unavailable ? "لسه مفيش احتمالات للنوع ده" : descriptions[mode.id];
          return `<button class="mode-option" type="button" data-action="select-mode" data-mode="${mode.id}" aria-pressed="${selectedGameMode === mode.id}" ${unavailable ? "disabled" : ""}>
            <span class="mode-art" aria-hidden="true">${mode.icon}</span>
            <span class="mode-copy"><strong>${mode.label}</strong><small>${description}</small></span>
            <span class="mode-count">${count} احتمال</span>
          </button>`;
        }).join("");
        game.innerHTML = `
          <div class="content">
            <div class="orb" aria-hidden="true">${renderRobotFace("home")}</div>
            <h2 class="welcome-title">فكّر في حاجة تحب أكتشفها</h2>
            <p class="description">فكّر في شخصية مشهورة، حيوان، مكان أو أي حاجة في بالك. هسألك أسئلة مناسبة واحدة واحدة لحد ما أوصل لتخمين.</p>
            <div class="mode-picker">
              <div class="mode-heading">
                <div><p class="mode-title">اختار عالم الجولة</p><p class="mode-subtitle">اضغط على النوع اللي في بالك عشان نبدأ</p></div>
                <span class="mode-heading-mark" aria-hidden="true">✦</span>
              </div>
              <div class="mode-options" role="group" aria-label="اختار نوع الجولة">${modes}</div>
            </div>
          </div>`;
      } else if (stage === "loading-question") {
        const progress = computeQuestionProgress();
        const confidence = Math.round(computeConfidence());
        game.innerHTML = `
          <div class="content">
            <div class="orb" aria-hidden="true">${renderRobotFace("loading-question")}</div>
            <p class="eyebrow">لَمحة بتفكّر</p>
            <h2>بختار سؤال مناسب</h2>
            <p class="description">بختار سؤالًا مناسبًا من المعلومات المتاحة عن الاحتمالات.</p>
            <div class="progress" aria-label="تقدّم اللعبة">
              <div class="progress-bar" style="width: ${progress}%"></div>
            </div>
            <div class="confidence-box"><span>تقدير الجولة</span><strong>${confidence}%</strong></div>
          </div>`;
      } else if (stage === "ai-error") {
        game.innerHTML = `
          <div class="content">
            <div class="orb" aria-hidden="true">${renderRobotFace("question")}</div>
            <p class="eyebrow">محتاجين معلومات أكتر</p>
            <h2>مش لاقي سؤال يفرّق بين الاحتمالات</h2>
            <p class="description">جرّب تاني، أو علّم لَمحة إجابة جديدة عشان تقدر تميّز بين الاحتمالات بشكل أفضل.</p>
            <div class="actions">
              ${button("حاول تاني", "retry-question", "primary")}
              ${button("الرئيسية", "home", "secondary")}
            </div>
          </div>`;
      } else if (stage === "question") {
        const progress = computeQuestionProgress();
        const confidence = Math.round(computeConfidence());
        const moodMessage = askedQuestions.size < 2
          ? "أنا ببدأ بأسئلة عامة للتأكد من الاتجاه الصحيح"
          : askedQuestions.size < 5
            ? "أنا باخد خطوات متدرجة وأضيق الاحتمالات"
            : "أنا تقريبًا وصلت لوجهة السؤال النهائي";
        game.innerHTML = `
          <div class="content">
            <button class="hint-toggle" type="button" data-action="toggle-hint" aria-label="${hintVisible ? "إخفاء التلميح" : "إظهار تلميح"}" aria-expanded="${hintVisible}" title="تلميح">
              <svg viewBox="0 0 24 24" width="25" height="25" aria-hidden="true">
                <path d="M9 21h6m-5 0v-2h4v2m-5-4.1c-1.6-1.1-2.6-2.9-2.6-5a5.6 5.6 0 1 1 11.2 0c0 2.1-1 3.9-2.6 5-.7.5-1.1 1.2-1.1 2.1h-3.8c0-.9-.4-1.6-1.1-2.1Z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/>
              </svg>
            </button>
            <div class="orb" aria-hidden="true">${renderRobotFace("question")}</div>
            <p class="eyebrow">السؤال ${askedQuestions.size + 1} • مستوى التدرّج</p>
            <h2>هل ${escapeHtml(questionText(currentQuestion))}؟</h2>
            <p class="description">${moodMessage}</p>
            <div class="progress" aria-label="تقدّم اللعبة">
              <div class="progress-bar" style="width: ${progress}%"></div>
            </div>
            <div class="confidence-box"><span>تقدير الجولة</span><strong>${confidence}%</strong></div>
            ${hintVisible ? `<p class="hint-message" role="status">${escapeHtml(getHintText())}</p>` : ""}
            <div class="actions answer-actions" role="group" aria-label="اختار إجابتك">
              ${button("الظاهر لا", "answer-likely-no", "answer-likely-no")}
              ${button("من الممكن", "answer-possible", "answer-possible")}
              ${button("اه", "answer-yes", "answer-yes")}
              ${button("لا", "answer-no", "answer-no")}
              ${button("أنا لا أعلم", "answer-unknown", "answer-unknown")}
            </div>
          </div>`;
      } else if (stage === "guess") {
        const confidence = candidates.length === 1 ? 99 : Math.min(60, Math.round(computeConfidence()));
        game.innerHTML = `
          <div class="content">
            <div class="orb" aria-hidden="true">${renderRobotFace("guess")}</div>
            <p class="eyebrow">وصلت لتخمين!</p>
            <h2>هل اللي في بالك هو ${escapeHtml(candidates[0].name)}؟</h2>
            <div class="confidence-box"><span>تقدير الجولة</span><strong>${confidence}%</strong></div>
            <div class="actions">${button("أيوه، صح!", "guess-yes")}${button("لأ، غلط", "guess-no", "no")}</div>
          </div>`;
      } else if (stage === "learn-name") {
        const message = wrongGuess
          ? `كنت فاكر إنك بتفكر في ${escapeHtml(wrongGuess)}. إيه الحاجة اللي كانت في بالك؟`
          : "مش قادر أحدد تخميني. إيه الحاجة اللي كانت في بالك؟";
        const options = candidates.length > 1
          ? `<p class="possibilities">الاحتمالات اللي عندي: ${candidates.map(character => escapeHtml(character.name)).join("، ")}</p>`
          : "";
        game.innerHTML = `
          <div class="content">
            <div class="orb" aria-hidden="true">${renderRobotFace("learn-name")}</div>
            <p class="eyebrow">كل يوم بتعلّم حاجة جديدة</p>
            <h2>علّمني إجابة جديدة</h2>
            <p class="description">${message}</p>
            ${options}
            <form id="name-form" class="field">
              <label for="character-name">اسم الحاجة</label>
              <input id="character-name" name="name" maxlength="80" required autofocus placeholder="مثال: أسد">
              <div class="actions">${button("كمّل", "submit-name")}</div>
            </form>
          </div>`;
      } else if (stage === "learn-question") {
        game.innerHTML = `
          <div class="content">
            <div class="orb" aria-hidden="true">${renderRobotFace("learn-question")}</div>
            <p class="eyebrow">خطوة ١ من ٢</p>
            <h2>سؤال يميّزها</h2>
            <p class="description">اكتب سؤال إجابته بنعم أو لا، ويساعدني أفرّق بين <strong>${escapeHtml(targetCharacter.name)}</strong>${wrongGuess ? ` و<strong>${escapeHtml(wrongGuess)}</strong>` : " والحاجات التانية"}.</p>
            <form id="question-form" class="field">
              <label for="new-question">السؤال</label>
              <input id="new-question" name="question" maxlength="120" required autofocus placeholder="مثال: هل له جناحان؟">
              <div class="actions">${button("كمّل", "submit-question")}</div>
            </form>
          </div>`;
      } else if (stage === "learn-answer") {
        game.innerHTML = `
          <div class="content">
            <div class="orb" aria-hidden="true">${renderRobotFace("learn-answer")}</div>
            <p class="eyebrow">خطوة ٢ من ٢</p>
            <h2>إجابتك إيه؟</h2>
            <div class="question-card">هل ${escapeHtml(questionText(newQuestion))}؟</div>
            <p class="description">بالنسبة لـ ${escapeHtml(targetCharacter.name)}.</p>
            <div class="actions">${button("نعم", "learn-yes")}${button("لا", "learn-no", "secondary")}</div>
          </div>`;
      } else if (stage === "learn-attributes") {
        const question = remainingQuestions[0];
        game.innerHTML = `
          <div class="content">
            <div class="orb" aria-hidden="true">${renderRobotFace("learn-attributes")}</div>
            <p class="eyebrow">سؤال ${6 - remainingQuestions.length} من ٥ للتعلّم</p>
            <h2>بالنسبة لـ ${escapeHtml(targetCharacter.name)}...</h2>
            <div class="question-card">هل ${escapeHtml(questionText(question))}؟</div>
            <div class="actions">${button("نعم", "attribute-yes")}${button("لا", "attribute-no", "secondary")}</div>
          </div>`;
      } else if (stage === "learned") {
        game.innerHTML = `
          <div class="content">
            <div class="orb" aria-hidden="true">${renderRobotFace("learned")}</div>
            <p class="eyebrow">تم الحفظ بنجاح</p>
            <h2>اتعلّمت ${escapeHtml(targetCharacter.name)}!</h2>
            <p class="description">هفتكرها المرة الجاية على نفس المتصفح.</p>
            <div class="actions">${button("نلعب تاني", "home")}</div>
          </div>`;
      } else if (stage === "correct") {
        game.innerHTML = `
          <div class="content">
            <div class="orb" aria-hidden="true">${renderRobotFace("correct")}</div>
            <p class="eyebrow">يا سلام!</p>
            <h2>عرفتها صح!</h2>
            <p class="description">لَمحة كسبت الجولة دي.</p>
            <div class="actions">${button("نلعب تاني", "home")}</div>
          </div>`;
      }
    }

    game.addEventListener("submit", event => {
      event.preventDefault();
      const formData = new FormData(event.target);
      if (event.target.id === "name-form") submitName(formData.get("name"));
      if (event.target.id === "question-form") submitDistinguishingQuestion(formData.get("question"));
    });

    game.addEventListener("click", event => {
      const action = event.target.closest("[data-action]")?.dataset.action;
      if (!action) return;
      if (action === "select-mode") {
        selectedGameMode = event.target.closest("[data-action]").dataset.mode;
        startGame();
        return;
      }
      if (action === "toggle-hint") {
        hintVisible = !hintVisible;
        render();
        return;
      }
      if (action === "start") startGame();
      if (action === "retry-question") requestNextQuestion();
      if (action === "submit-name") document.querySelector("#name-form").requestSubmit();
      if (action === "submit-question") document.querySelector("#question-form").requestSubmit();
      if (action === "answer-likely-no") answerQuestion("الظاهر لا");
      if (action === "answer-possible") answerQuestion("من الممكن");
      if (action === "answer-yes") answerQuestion("نعم");
      if (action === "answer-no") answerQuestion("لا");
      if (action === "answer-unknown") answerQuestion("أنا لا أعلم");
      if (action === "guess-yes") { playTone(780, 120, "triangle", 0.03); stopMusic(); stage = "correct"; render(); }
      if (action === "guess-no") { playTone(220, 120, "square", 0.025); beginLearning(candidates[0].name); }
      if (action === "learn-yes" || action === "learn-no") finishLearning(action === "learn-yes" ? "نعم" : "لا");
      if (action === "attribute-yes" || action === "attribute-no") answerRemainingQuestion(action === "attribute-yes" ? "نعم" : "لا");
      if (action === "home") { playTone(500, 100, "sine", 0.02); stopMusic(); stage = "home"; render(); }
    });

    document.querySelector("#music-toggle").addEventListener("click", () => {
      musicEnabled = !musicEnabled;
      try { localStorage.setItem(MUSIC_KEY, musicEnabled ? "on" : "off"); } catch (error) {}
      updateMusicToggle();
      if (musicEnabled) startMusic();
      else stopMusic();
    });

    document.querySelector("#sound-toggle").addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      try { localStorage.setItem(SOUND_KEY, soundEnabled ? "on" : "off"); } catch (error) {}
      updateSoundToggle();
      if (soundEnabled) playTone(740, 100, "sine", 0.025);
    });

    updateMusicToggle();
    updateSoundToggle();
    render();
    refreshAiStatus();
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(error => console.warn("تعذر تفعيل وضع عدم الاتصال:", error));
      });
    }
  </script>
</body>
</html>
